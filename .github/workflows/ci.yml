# Gitflow pipeline
#
#   feature/*, bugfix/*  -> test + packages (CI artifacts)        PR target: develop
#   develop              -> test + packages (x.y.z-dev.N)
#   release/*, hotfix/*  -> test + packages (x.y.z-rc.N)          PR target: main (and develop)
#   main                 -> test + packages + GitHub Release vX.Y.Z (if that tag doesn't exist yet)
#   tag v*               -> test + packages + GitHub Release (tag must match Cargo.toml version)
#
# Bump `version` in Cargo.toml on the release/hotfix branch; merging it into main publishes it.
name: ci

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gitflow:
    name: gitflow rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source -> target
        env:
          SRC: ${{ github.head_ref }}
          TGT: ${{ github.base_ref }}
        run: |
          case "$TGT" in
            main)    allowed='^(release|hotfix)/' ;;
            develop) allowed='^(feature|bugfix|release|hotfix)/' ;;
            *)       exit 0 ;;
          esac
          if [[ ! "$SRC" =~ $allowed ]]; then
            echo "::error::Gitflow: '$SRC' may not be merged into '$TGT' (allowed: $allowed)"
            exit 1
          fi
          echo "Gitflow OK: $SRC -> $TGT"

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Compute version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.run_number }}
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          branch=${HEAD_REF:-$REF_NAME}
          release=false
          if [[ "$REF_TYPE" == tag ]]; then
            version=${REF_NAME#v}
            if [[ "$version" != "$base" ]]; then
              echo "::error::Tag $REF_NAME does not match Cargo.toml version $base"
              exit 1
            fi
            release=true
          elif [[ "$EVENT" == pull_request ]]; then
            version="$base-pr.$RUN"
          else
            case "$branch" in
              main)
                version=$base
                if [[ -z "$(git ls-remote --tags origin "refs/tags/v$base")" ]]; then
                  release=true
                else
                  echo "::notice::v$base already released; bump Cargo.toml on a release/hotfix branch to publish"
                fi ;;
              develop) version="$base-dev.$RUN" ;;
              release/*|hotfix/*)
                named=${branch#*/}; named=${named#v}
                if [[ "$named" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$named" != "$base" ]]; then
                  echo "::warning::Branch $branch but Cargo.toml version is $base"
                fi
                version="$base-rc.$RUN" ;;
              *)
                slug=$(echo "${branch#*/}" | tr -c '[:alnum:]-' '-' | sed 's/-*$//' | cut -c1-40)
                version="$base-$slug.$RUN" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### Version \`$version\` (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  package:
    name: package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  deb: true }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, deb: true }
          - { name: macos-x86_64,   os: macos-latest,     target: x86_64-apple-darwin }
          - { name: macos-aarch64,  os: macos-latest,     target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          name="aznet-$VERSION-${{ matrix.name }}"
          bin=aznet; [[ "$RUNNER_OS" == Windows ]] && bin=aznet.exe
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md "$name/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "dist/$name.zip" "$name" >/dev/null
          else
            tar czf "dist/$name.tar.gz" "$name"
          fi
      - name: Debian package
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - if: matrix.deb
        run: cargo deb --no-build --target ${{ matrix.target }} --deb-version "$VERSION" --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: aznet-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.release == 'true' && 90 || 14 }}

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aznet-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
