[package]
name = "aznet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Azure network helper CLI: find the next free subnet in a VNet across subscriptions"
license = "MIT"
readme = "README.md"

[workspace]
members = ["."]

[[bin]]
name = "aznet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
futures = "0.3"
# 0.13 matches azure_core (one HTTP stack in the binary). Default TLS = rustls + OS platform
# verifier, so corporate TLS-inspection CAs from the OS trust store work without OpenSSL.
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
azure_core = "1.0"
azure_identity = { version = "1.0", features = ["tokio"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
